<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Velásquez</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
        :root {
            --fondo-oscuro: #0e0630;
            --primario: #6259e3;
            --secundario: #8942cf;
            --brillo-joya: #dcd7ff;
            --texto-claro: #e0dcfc;
        }

        body {
            background: radial-gradient(circle at center, #1a104d 0%, #0e0630 100%);
            color: var(--texto-claro);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        /* Tarjeta de perfil - Estilo Cristal Sobrio */
        .bloque {
            background: rgba(39, 16, 95, 0.3);
            backdrop-filter: blur(15px);
            padding: 50px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.4s ease;
        }

        .bloque:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Imagen de perfil con marco de "Plata/Cromo" */
        .bloque img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid transparent;
            background: linear-gradient(var(--morado-oscuro), var(--morado-oscuro)) padding-box,
                        linear-gradient(45deg, #ffffff, var(--primario), #ffffff) border-box;
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(98, 89, 227, 0.2);
        }

        /* 1. EL NOMBRE CON EFECTO PLATEADO */
        .bloque h2 {
            margin: 10px 0;
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.1;
            
            /* Efecto Plateado / Cromo */
            background: linear-gradient(to bottom, #ffffff 30%, var(--brillo-joya) 100%);
            background-clip: text; /* Propiedad estándar */
            -webkit-background-clip: text; /* Para compatibilidad con Chrome/Safari */
            -webkit-text-fill-color: transparent;
            color: transparent; /* "Respaldo" por si acaso */
            
            /* Sombra para dar volumen de pieza sólida */
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }

        /* 2. Subtitulo */
        .bloque p {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primario);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-top: 15px;
            margin-bottom: 0;
        }

        /* 3. SEPARACIÓN DE LOS BOTONES */
        .bloque2 {
            margin-top: 45px; /* Aquí ajustas qué tan lejos quieres los botones */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Botones Estilo Editorial Minimalista */
        .boton {
            display: block;
            background-color: transparent;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .boton:hover {
            background-color: white;
            color: var(--fondo-oscuro);
            letter-spacing: 5px; /* Efecto de expansión sutil */
        }

    </style>
</head>

<body>
    <div class="contenedor">
        <div class="bloque">
            <img src="img/foto perfil.jpg" alt="Michelle Velásquez">
            <h2>Michelle Velásquez Sáez</h2>
            <p>Artista Visual</p>
        </div>

        <div class="bloque2">
            <a href="obras.html" class="boton">Obras</a>
            <a href="contacto.html" class="boton">Contacto</a>
        </div>
    </div>
</body>
</html>
