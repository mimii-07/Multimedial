<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft | Michelle Velásquez</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo-oscuro: #0e0630;
            --primario: #6259e3;
            --brillo-joya: #dcd7ff;
            --texto-claro: #e0dcfc;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a104d 0%, #0e0630 100%);
            color: var(--texto-claro);
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center; 
        }

        /* Contenedor principal */
        .contenedor {
            width: 90%;
            max-width: 800px;
            margin: auto;
        }

        /* Bloques estilo cristal */
        .bloque {
            background: rgba(39, 16, 95, 0.3);
            backdrop-filter: blur(10px);
            margin: 30px 0;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-align: center;
        }

        .bloque:hover {
            border-color: var(--primario);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Título de la obra */
        .bloque h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 2.3rem; /* Ajustado para el título largo */
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .boton-titulo {
            text-decoration: none;
            background: linear-gradient(to bottom, #ffffff 30%, var(--brillo-joya) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Imágenes con marco de cromo */
        .bloque img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin-bottom: 20px;
            border: 2px solid transparent;
            background: linear-gradient(var(--fondo-oscuro), var(--fondo-oscuro)) padding-box,
                        linear-gradient(45deg, #fff, var(--primario), #fff) border-box;
            transition: filter 0.3s ease;
        }

        .bloque:hover img {
            filter: contrast(1.05) brightness(1.05);
        }

        /* Texto descriptivo */
        .bloque p {
            color: var(--brillo-joya);
            line-height: 1.5;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            opacity: 0.8;
        }

        /* Navegación final */
        .bloque2 {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 80px;
        }

        .bloque2 a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: inline-block;
            margin: 10px 0;
            border-bottom: 1px solid var(--primario);
            padding-bottom: 5px;
            transition: 0.3s;
        }

        .bloque2 a:hover {
            color: var(--primario);
            letter-spacing: 5px;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <div class="bloque">
            <h2><a class="boton-titulo">Bodegón vicioso en Minecraft (2026)</a></h2>   
        </div>

        <div class="bloque">
            <img src="img/minecraft.jpg" alt="Obra principal Minecraft">
            <p>Oleo sobre tela. 100x100cm.</p>    
        </div>

        <div class="bloque">
            <img src="img/zoom1.jpeg" alt="Zoom 1">
            <p>Detalle técnica al óleo</p>
        </div>

        <div class="bloque">
            <img src="img/zoom2.jpeg" alt="Zoom 2">
            <p>Detalle de composición</p>
        </div>

        <div class="bloque">
            <img src="img/zoom3.jpeg" alt="Zoom 3">
            <p>Detalle de color</p>
        </div>

        <div class="bloque">
            <img src="img/zoom4.jpeg" alt="Zoom 4">
            <p>Detalle final</p>
        </div>

        <div class="bloque2">
            <a href="obras.html">Ir a Obras</a><br>
            <a href="index.html">Inicio</a><br>
            <a href="contacto.html">Contacto</a><br>
        </div>

    </div>

</body>
</html>
