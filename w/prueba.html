<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Michelle Velásquez</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo-oscuro: #0e0630;
            --primario: #6259e3;
            --brillo-joya: #dcd7ff;
            --texto-claro: #e0dcfc;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a104d 0%, #0e0630 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 400px;
        }

        .bloque-contacto {
            background: rgba(39, 16, 95, 0.4);
            backdrop-filter: blur(20px);
            padding: 50px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            letter-spacing: 12px;
            margin-bottom: 45px;
            background: linear-gradient(to bottom, #ffffff 30%, var(--brillo-joya) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-contacto {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Bloque Instagram con borde de luz sutil */
        .boton-ig {
            text-decoration: none;
            display: block;
            padding: 20px;
            border-radius: 15px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        .boton-ig:hover {
            background: rgba(98, 89, 227, 0.15);
            border-color: var(--primario);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(98, 89, 227, 0.2);
        }

        /* Estilo para los labels y textos */
        .label {
            display: block;
            font-size: 0.65rem;
            color: var(--primario);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .dato-texto {
            display: block;
            font-size: 0.9rem;
            color: #fff;
            letter-spacing: 1.5px;
        }

        /* Bloque Correo (Estático) */
        .correo-box {
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0.8;
        }

        .nav-inicio {
            margin-top: 40px;
        }

        .boton-inicio {
            text-decoration: none;
            color: white;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.4;
            border-bottom: 1px solid transparent;
            padding-bottom: 5px;
            transition: 0.3s;
        }

        .boton-inicio:hover {
            opacity: 1;
            border-bottom-color: var(--primario);
        }

    </style>
</head>

<body>

    <div class="contenedor">
        <div class="bloque-contacto">
            <h2>CONTACTO</h2>  
            
            <div class="info-contacto">
                <a href="https://www.instagram.com/mimiiki.art/" target="_blank" class="boton-ig">
                    <span class="label">Instagram</span>
                    <span class="dato-texto">@mimiiki.art</span>
                </a>

                <div class="correo-box">
                    <span class="label">Email</span>
                    <span class="dato-texto">michelle.alevs07@gmail.com</span>
                </div>
            </div>

            <div class="nav-inicio">
                <a href="index.html" class="boton-inicio">Volver</a>
            </div>
        </div>
    </div>

</body>
</html>
