<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michelle Velásquez | Obras</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --fondo-oscuro: #0e0630;
            --primario: #6259e3;
            --brillo-joya: #dcd7ff;
            --texto-claro: #e0dcfc;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #1a104d 0%, #0e0630 100%);
            color: var(--texto-claro);
            margin: 0;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
        }

        /* Título de la sección estilo Joya */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 40px;
            background: linear-gradient(to bottom, #ffffff 30%, var(--brillo-joya) 100%);
            -webkit-background-clip: text;
            background-clip: text; /* Para evitar el error en VS Code */
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }
        
        /* Contenedor principal */
        .contenedor {
            width: 90%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            align-items: stretch; /* Para que todos los bloques tengan el mismo alto */
            gap: 25px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        /* Bloque / Tarjeta de Obra */
        .bloque {
            background: rgba(39, 16, 95, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            width: 280px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            flex-direction: column;
        }

        .bloque:hover {
            transform: translateY(-10px);
            border-color: var(--primario);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* Imagen con marco metálico */
        .bloque img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid transparent;
            background: linear-gradient(var(--fondo-oscuro), var(--fondo-oscuro)) padding-box,
                        linear-gradient(45deg, #fff, var(--primario), #fff) border-box;
            display: block;
            margin-bottom: 15px;
            transition: filter 0.3s ease;
        }

        .bloque:hover img {
            filter: contrast(1.1) brightness(1.1);
        }

        /* Títulos de las obras */
        .bloque h2 {
            margin: 10px 0;
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            min-height: 50px; /* Para alinear títulos de 1 o 2 líneas */
        }

        /* Botón dentro del título */
        .boton {
            text-decoration: none;
            color: #fff;
            background-color: var(--primario);
            padding: 8px 15px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            display: inline-block;
        }

        .boton:hover {
            background-color: white;
            color: var(--fondo-oscuro);
            box-shadow: 0 0 15px var(--primario);
        }

        /* Texto descriptivo */
        .bloque p {
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--brillo-joya);
            margin-bottom: 15px;
            flex-grow: 1; /* Empuja el contenido para que todo cuadre */
        }

        /* Enlaces de navegación inferiores */
        .nav-inferior {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .nav-inferior a {
            text-decoration: none;
            color: white;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--primario);
            padding-bottom: 5px;
            transition: 0.3s;
        }

        .nav-inferior a:hover {
            color: var(--primario);
            letter-spacing: 4px;
        }
    </style>
</head>

<body>

    <h1>Colecciones</h1>

    <div class="contenedor">
        <div class="bloque">
            <img src="img/pawer.jpeg" alt="Serie Pawer!">
            <h2><a href="Obra1.html" class="boton">Pawer!</a></h2>
            <p>Serie de nueve cuadros al óleo sobre tela.</p>    
        </div>

        <div class="bloque">
            <img src="img/IMG_8686.jpeg" alt="Bling">
            <h2><a href="Obra2.html" class="boton">Bling</a></h2>
            <p>Óleo sobre tela. Exploración de texturas y brillo.</p>
        </div>

        <div class="bloque">
            <img src="img/cuerpos.jpeg" alt="Cuerpos">
            <h2><a href="Obra3.html" class="boton">Cuerpos</a></h2>
            <p>Serie de ocho cuadros al óleo centrados en la figura.</p>
        </div>

        <div class="bloque">
            <img src="img/minecraft.jpg" alt="Minecraft">
            <h2><a href="Obra4.html" class="boton">Bodegón Vicioso</a></h2>
            <p>Oleo sobre tela. Estética digital llevada a lo pictórico.</p>
        </div>
    </div>

    <div class="nav-inferior">
        <a href="index.html">Volver al Inicio</a>
        <a href="contacto.html">Contacto</a>
    </div>

</body>
</html>
